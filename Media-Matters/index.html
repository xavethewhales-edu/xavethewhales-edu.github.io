<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Matters has moved</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .handoff {
      max-width: 600px;
      padding: 40px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.5;
      opacity: 0.85;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      border-radius: 8px;
      background: white;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <main class="handoff">
    <h1>Media Matters has moved</h1>
    <p>
      This course is now available at its new location.
    </p>

    <a href="https://media-matters.pages.dev/">
      Open Media Matters
    </a>
  </main>
</body>
</html>
